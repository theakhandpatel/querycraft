name: Browser sample

# The public sample: the built-in library, the in-browser engines, local
# progress. The hosted product (accounts, AI, stored courses) is a separate
# build. This workflow publishes only the static artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build the browser sample
        run: make static

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the sample
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-static
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
